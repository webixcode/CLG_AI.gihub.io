<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CLG AI | Нейросеть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; }
        .app-container { width: 100%; height: 100vh; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); }
        .header { background: rgba(0, 0, 0, 0.4); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .logo-text { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .badge { background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 20px; font-size: 10px; color: #aaa; }
        .user-info { display: flex; gap: 10px; align-items: center; }
        .user-name { color: white; font-size: 14px; font-weight: 500; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 30px; }
        button { padding: 6px 14px; border: none; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-danger { background: rgba(239,68,68,0.8); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .menu-btn { background: rgba(255,255,255,0.2); border: none; font-size: 24px; padding: 5px 12px; border-radius: 25px; color: white; cursor: pointer; display: none; }
        .chat-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: rgba(0,0,0,0.5); border-right: 1px solid rgba(255,255,255,0.1); padding: 16px; overflow-y: auto; }
        .sidebar h3 { color: white; font-size: 16px; margin-bottom: 12px; }
        .new-dialog-btn { width: 100%; padding: 10px; margin-bottom: 16px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .dialog-item { background: rgba(255,255,255,0.08); padding: 10px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; }
        .dialog-item.active { background: linear-gradient(135deg, rgba(102,126,234,0.4), rgba(118,75,162,0.4)); }
        .dialog-title { color: white; font-weight: 500; font-size: 14px; }
        .dialog-date { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .delete-dialog-btn { background: rgba(239,68,68,0.6); border: none; padding: 4px 8px; border-radius: 8px; color: white; font-size: 11px; margin-top: 8px; cursor: pointer; width: 100%; }
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; max-width: 80%; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; }
        .message.bot { align-self: flex-start; }
        .message-content { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .user .message-content { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .bot .message-content { background: rgba(255,255,255,0.12); color: white; }
        .input-panel { background: rgba(0,0,0,0.4); padding: 10px 16px; display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        .input-panel input { flex: 1; padding: 10px 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 30px; color: white; font-size: 14px; }
        .input-panel input:focus { outline: none; border-color: #667eea; }
        .send-btn { background: linear-gradient(135deg, #667eea, #764ba2); border: none; padding: 0 20px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; }
        .status-bar { background: rgba(0,0,0,0.3); padding: 6px 16px; font-size: 11px; color: rgba(255,255,255,0.5); text-align: center; }
        .typing-indicator { display: inline-block; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: white; margin: 0 2px; animation: typing 1.4s infinite; }
        @keyframes typing { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .auth-wrapper { display: flex; justify-content: center; align-items: center; flex: 1; padding: 20px; }
        .auth-card { background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); border-radius: 28px; padding: 32px 24px; width: 100%; max-width: 360px; }
        .auth-card h2 { color: white; text-align: center; font-size: 26px; margin-bottom: 24px; }
        .auth-card input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; color: white; font-size: 15px; }
        .auth-card input:focus { outline: none; border-color: #667eea; }
        .auth-card .btn-block { width: 100%; padding: 12px; margin-top: 16px; border-radius: 30px; font-size: 16px; font-weight: bold; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; cursor: pointer; }
        .auth-card .switch-link { text-align: center; margin-top: 16px; color: rgba(255,255,255,0.6); font-size: 14px; cursor: pointer; }
        .auth-card .switch-link a { color: #8b74ff; }
        .auth-card .error-text { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 12px; }
        .auth-card .success-text { color: #6bff8b; font-size: 13px; text-align: center; margin-top: 12px; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -300px; top: 60px; width: 260px; height: calc(100% - 60px); z-index: 100; transition: left 0.3s; border-radius: 0 16px 16px 0; background: rgba(0,0,0,0.85); }
            .sidebar.open { left: 0; }
            .menu-btn { display: block; }
            .message { max-width: 90%; }
        }
        @media (min-width: 769px) { .menu-btn { display: none; } .sidebar { display: block !important; position: relative; left: auto !important; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-card { background: #1a1a2e; border-radius: 28px; padding: 28px; width: 90%; max-width: 360px; }
        .modal-card h3 { color: white; font-size: 22px; margin-bottom: 20px; text-align: center; }
        .modal-card input { width: 100%; padding: 14px; margin: 8px 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; color: white; font-size: 15px; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ========== ВСТАВЬ СВОЙ API КЛЮЧ СЮДА ==========
    const API_KEY = '%%API_KEY%%';
    const API_URL = 'https://openrouter.ai/api/v1/chat/completions';

    async function getAIResponse(message, history) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek/deepseek-chat:free',
                    messages: [
                        { role: 'system', content: 'Ты — CLG AI, умный помощник. Отвечай на русском языке. Тебя создала компания ClooGames, владелец — Артём Крипто. Сейчас 2026 год.' },
                        ...history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text })),
                        { role: 'user', content: message }
                    ],
                    temperature: 0.7,
                    max_tokens: 1000
                })
            });
            if (!response.ok) return 'Ошибка API. Проверьте интернет.';
            const data = await response.json();
            if (data.choices && data.choices[0] && data.choices[0].message) {
                return data.choices[0].message.content;
            }
            return 'Ошибка. Попробуйте ещё раз.';
        } catch (error) {
            return 'Ошибка соединения. Проверьте интернет.';
        }
    }

    // ========== ВСЯ ЛОГИКА АВТОРИЗАЦИИ И ДИАЛОГОВ ==========
    let users = [];
    let currentUser = null;
    let currentDialogId = null;
    let currentMessages = [];
    let dialogs = {};

    function loadData() {
        const savedUsers = localStorage.getItem('clg_users');
        if (savedUsers) users = JSON.parse(savedUsers);
        else users = [];
        const savedDialogs = localStorage.getItem('clg_dialogs');
        if (savedDialogs) dialogs = JSON.parse(savedDialogs);
    }
    function saveUsers() { localStorage.setItem('clg_users', JSON.stringify(users)); }
    function saveDialogs() { localStorage.setItem('clg_dialogs', JSON.stringify(dialogs)); }

    function registerUser(login, password, name) {
        if (!login.trim()) return { success: false, error: 'Введите логин' };
        if (!password.trim()) return { success: false, error: 'Введите пароль' };
        if (!name.trim()) return { success: false, error: 'Введите имя' };
        if (users.some(u => u.login === login)) return { success: false, error: 'Логин уже занят' };
        users.push({ login, password, name: name.trim() });
        saveUsers();
        if (!dialogs[login]) dialogs[login] = {};
        saveDialogs();
        return { success: true };
    }

    function loginUser(login, password) {
        const user = users.find(u => u.login === login && u.password === password);
        if (user) return { success: true, user };
        return { success: false, error: 'Неверный логин или пароль' };
    }

    function updateProfile(oldLogin, newLogin, newPass, newName) {
        const idx = users.findIndex(u => u.login === oldLogin);
        if (idx === -1) return { success: false, error: 'Пользователь не найден' };
        let finalLogin = oldLogin;
        if (newLogin && newLogin !== oldLogin) {
            if (users.some(u => u.login === newLogin)) return { success: false, error: 'Логин занят' };
            finalLogin = newLogin;
        }
        users[idx] = {
            login: finalLogin,
            password: newPass && newPass.trim() ? newPass : users[idx].password,
            name: newName && newName.trim() ? newName.trim() : users[idx].name
        };
        saveUsers();
        if (finalLogin !== oldLogin && dialogs[oldLogin]) {
            dialogs[finalLogin] = dialogs[oldLogin];
            delete dialogs[oldLogin];
            saveDialogs();
        }
        return { success: true, newLogin: finalLogin };
    }

    function createDialog() {
        if (!currentUser) return null;
        if (!dialogs[currentUser.login]) dialogs[currentUser.login] = {};
        const id = Date.now().toString();
        const count = Object.keys(dialogs[currentUser.login]).length + 1;
        dialogs[currentUser.login][id] = { id, name: `Диалог ${count}`, messages: [], createdAt: new Date().toISOString() };
        saveDialogs();
        return id;
    }

    function saveDialog(id, msgs) {
        if (currentUser && dialogs[currentUser.login]?.[id]) {
            dialogs[currentUser.login][id].messages = [...msgs];
            saveDialogs();
        }
    }

    function loadDialog(id) { return currentUser && dialogs[currentUser.login]?.[id]?.messages || []; }
    function deleteDialog(id) { if (currentUser && dialogs[currentUser.login]?.[id]) { delete dialogs[currentUser.login][id]; saveDialogs(); } }

    function render() {
        const app = document.getElementById('app');
        if (!currentUser) renderAuth(app);
        else renderChat(app);
    }

    function renderAuth(container) {
        container.innerHTML = `
            <div class="app-container">
                <div class="header">
                    <div class="logo"><div class="logo-icon">🧠</div><div class="logo-text">CLG AI</div><div class="badge">2026</div></div>
                </div>
                <div class="auth-wrapper">
                    <div id="loginCard" class="auth-card">
                        <h2>✨ Вход</h2>
                        <input type="text" id="loginLogin" placeholder="Логин">
                        <input type="password" id="loginPassword" placeholder="Пароль">
                        <div id="loginError" class="error-text"></div>
                        <button class="btn-block" id="doLoginBtn">Войти</button>
                        <div class="switch-link">Нет аккаунта? <a id="showRegisterBtn">Зарегистрироваться</a></div>
                    </div>
                    <div id="registerCard" class="auth-card" style="display:none">
                        <h2>📝 Регистрация</h2>
                        <input type="text" id="regLogin" placeholder="Логин">
                        <input type="text" id="regName" placeholder="Имя">
                        <input type="password" id="regPassword" placeholder="Пароль">
                        <div id="regError" class="error-text"></div>
                        <div id="regSuccess" class="success-text"></div>
                        <button class="btn-block" id="doRegisterBtn">Зарегистрироваться</button>
                        <div class="switch-link">Уже есть аккаунт? <a id="showLoginBtn">Войти</a></div>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('doLoginBtn').onclick = () => {
            const res = loginUser(document.getElementById('loginLogin').value, document.getElementById('loginPassword').value);
            if (res.success) {
                currentUser = res.user;
                if (!dialogs[currentUser.login] || !Object.keys(dialogs[currentUser.login]).length) currentDialogId = createDialog();
                else currentDialogId = Object.keys(dialogs[currentUser.login])[0];
                render();
            } else {
                document.getElementById('loginError').innerText = res.error;
            }
        };
        document.getElementById('showRegisterBtn').onclick = () => {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('registerCard').style.display = 'block';
        };
        document.getElementById('showLoginBtn').onclick = () => {
            document.getElementById('registerCard').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
        };
        document.getElementById('doRegisterBtn').onclick = () => {
            const res = registerUser(document.getElementById('regLogin').value, document.getElementById('regPassword').value, document.getElementById('regName').value);
            if (res.success) {
                document.getElementById('regSuccess').innerText = '✅ Регистрация успешна! Войдите.';
                setTimeout(() => {
                    document.getElementById('registerCard').style.display = 'none';
                    document.getElementById('loginCard').style.display = 'block';
                    document.getElementById('regSuccess').innerText = '';
                }, 1500);
            } else {
                document.getElementById('regError').innerText = res.error;
            }
        };
    }

    function renderChat(container) {
        if (currentDialogId) currentMessages = loadDialog(currentDialogId);
        
        container.innerHTML = `
            <div class="app-container">
                <div class="header">
                    <div class="logo"><div class="logo-icon">🧠</div><div class="logo-text">CLG AI</div><div class="badge">2026</div></div>
                    <div class="user-info">
                        <span class="user-name">👤 ${escapeHtml(currentUser.name)}</span>
                        <button class="btn-secondary" id="profileBtn">⚙️</button>
                        <button class="btn-danger" id="logoutBtn">🚪</button>
                        <button class="menu-btn" id="menuToggleBtn">☰</button>
                    </div>
                </div>
                <div class="chat-layout">
                    <div class="sidebar" id="sidebar">
                        <h3>💬 Диалоги</h3>
                        <button class="new-dialog-btn" id="newDialogBtn">➕ Новый диалог</button>
                        <div id="dialogsList"></div>
                    </div>
                    <div class="chat-area">
                        <div class="messages" id="messagesList"></div>
                        <div class="input-panel">
                            <input type="text" id="messageInput" placeholder="Спроси меня о чём угодно...">
                            <button class="send-btn" id="sendBtn">Отправить</button>
                        </div>
                        <div class="status-bar" id="statusMsg">🤖 CLG AI | Умная нейросеть • 2026</div>
                    </div>
                </div>
            </div>
        `;
        
        renderMessages();
        renderDialogsList();
        
        document.getElementById('sendBtn').onclick = () => sendMessage();
        document.getElementById('messageInput').onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
        document.getElementById('logoutBtn').onclick = () => { currentUser = null; currentDialogId = null; currentMessages = []; render(); };
        document.getElementById('profileBtn').onclick = () => showProfileModal();
        document.getElementById('newDialogBtn').onclick = () => {
            if (currentMessages.length && currentDialogId) saveDialog(currentDialogId, currentMessages);
            const newId = createDialog();
            if (newId) { currentDialogId = newId; currentMessages = []; renderChat(container); }
        };
        
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menuToggleBtn');
        let isMenuOpen = false;
        menuBtn.onclick = () => {
            if (isMenuOpen) { sidebar.classList.remove('open'); isMenuOpen = false; }
            else { sidebar.classList.add('open'); isMenuOpen = true; }
        };
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            currentMessages.push({ role: 'user', text });
            saveDialog(currentDialogId, currentMessages);
            renderMessages();
            const status = document.getElementById('statusMsg');
            status.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span> CLG AI думает...</div>';
            const reply = await getAIResponse(text, currentMessages.slice(0, -1));
            currentMessages.push({ role: 'assistant', text: reply });
            saveDialog(currentDialogId, currentMessages);
            renderMessages();
            status.innerHTML = '🤖 CLG AI | Умная нейросеть • 2026';
        }
        
        function renderMessages() {
            const c = document.getElementById('messagesList');
            if (c) {
                c.innerHTML = currentMessages.map(m => `<div class="message ${m.role}"><div class="message-content">${escapeHtml(m.text)}</div></div>`).join('');
                c.scrollTop = c.scrollHeight;
            }
        }
        
        function renderDialogsList() {
            const c = document.getElementById('dialogsList');
            if (!c) return;
            const d = dialogs[currentUser.login] || {};
            const arr = Object.values(d).reverse();
            if (!arr.length) {
                c.innerHTML = '<div style="color:rgba(255,255,255,0.5); text-align:center; padding:20px;">Нет диалогов<br>Создайте новый</div>';
                return;
            }
            c.innerHTML = arr.map(d => `
                <div class="dialog-item ${currentDialogId === d.id ? 'active' : ''}" data-id="${d.id}">
                    <div class="dialog-title">${escapeHtml(d.name)}</div>
                    <div class="dialog-date">${new Date(d.createdAt).toLocaleDateString()}</div>
                    <button class="delete-dialog-btn" data-id="${d.id}">🗑️ Удалить</button>
                </div>
            `).join('');
            
            document.querySelectorAll('.dialog-item').forEach(el => {
                const id = el.getAttribute('data-id');
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-dialog-btn')) return;
                    if (currentMessages.length && currentDialogId) saveDialog(currentDialogId, currentMessages);
                    currentDialogId = id;
                    currentMessages = loadDialog(id);
                    renderChat(container);
                });
                const delBtn = el.querySelector('.delete-dialog-btn');
                if (delBtn) {
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm('Удалить диалог?')) {
                            deleteDialog(id);
                            if (currentDialogId === id) {
                                const keys = Object.keys(dialogs[currentUser.login] || {});
                                currentDialogId = keys.length ? keys[0] : createDialog();
                                currentMessages = currentDialogId ? loadDialog(currentDialogId) : [];
                            }
                            renderChat(container);
                        }
                    });
                }
            });
        }
    }

    function showProfileModal() {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-card"><h3>⚙️ Профиль</h3><input type="text" id="editName" placeholder="Имя" value="${escapeHtml(currentUser.name)}"><input type="text" id="editLogin" placeholder="Логин" value="${currentUser.login}"><input type="password" id="editPass" placeholder="Новый пароль"><div id="err" style="color:#ff6b6b; font-size:13px; text-align:center;"></div><div class="modal-buttons"><button id="saveBtn" style="background:#667eea; color:white;">Сохранить</button><button id="closeBtn" style="background:#333; color:white;">Отмена</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById('saveBtn').onclick = () => {
            const res = updateProfile(currentUser.login, document.getElementById('editLogin').value, document.getElementById('editPass').value, document.getElementById('editName').value);
            if (res.success) { currentUser = users.find(u => u.login === (res.newLogin || document.getElementById('editLogin').value)); alert('✅ Профиль обновлён'); modal.remove(); render(); }
            else document.getElementById('err').innerText = res.error;
        };
        document.getElementById('closeBtn').onclick = () => modal.remove();
    }

    function escapeHtml(str) { return str ? str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])) : ''; }

    loadData();
    render();
</script>
</body>
</html>
